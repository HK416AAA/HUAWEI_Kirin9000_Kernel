name: build-kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "patches/**"
      - ".github/workflows/build-kernel.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-12 lld-12 llvm-12 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            build-essential bc flex bison libssl-dev libelf-dev \
            python3 kmod cpio lz4 xz-utils zstd rsync git patch
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-12 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-12 100
          clang --version

      - name: Build kernel
        run: |
          chmod +x patches/build-kernel.sh
          KERNEL_DIR=kernel OUT_DIR=out bash patches/build-kernel.sh

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.lz4 artifacts/ 2>/dev/null || true
          cp out/.config artifacts/kernel.config 2>/dev/null || true
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: artifacts/
          retention-days: 7
